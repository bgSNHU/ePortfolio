<form [formGroup]="addArtistForm" (ngSubmit)="onSubmit()">

  <label for="artistName">Artist name: </label>
  <input id="artistName" type="text" formControlName="artistName" />
  @if(addArtistForm?.get('artistName')?.invalid && addArtistForm?.get('artistName')?.touched) {
    <div class="text-danger">Please enter an Artist name</div>
  }

  <label for="artistBirthday">Birthday: </label>
  <input type="date" id="artistBirthday" formControlName="artistBirthday">

  <select id="artistSongs" formControlName="artistSongs">
    <option value="">Select songs</option>
    @for (song of artistSongsDropdown; track song._id) {
        <option [value]="song._id">{{ song.songTitle }}</option>
    }
</select>
<a routerLink="/add-song">+ Add new song</a>

    <select id="artistAlbums" formControlName="artistAlbums">
    <option value="">Select an album</option>
    @for (album of artistAlbumsDropdown; track album._id) {
        <option [value]="album._id">{{ album.albumName }}</option>
    }
</select>
<a routerLink="/add-album">Add new album</a>

  <button type="submit">Submit</button>
</form>

@if (notificationService.message) {
    <div [class]="'notification ' + notificationService.messageType">
        {{ notificationService.message }}
    </div>
  }
