<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-dark text-white">
                  <h3 class="mb-0">Add Artist</h3>
                </div>
                <div class="card-body">
                  <form [formGroup]="addArtistForm" (ngSubmit)="onSubmit()">
                    <div class="mb-3">
                      <label for="artistName" class="form-label">Artist name: </label>
                      <input id="artistName" type="text" class="form-control" formControlName="artistName" />
                      @if(addArtistForm?.get('artistName')?.invalid && addArtistForm?.get('artistName')?.touched) {
                        <div class="text-danger small">Please enter an Artist name</div>
                      }
                    </div>

                    <div class="mb-3">
                      <label for="artistBirthday" class="form-label">Birthday: </label>
                      <input type="date" id="artistBirthday" class="form-control" formControlName="artistBirthday">
                    </div>

                    <div class="mb-3">
                      <label for="artistSongs" class="form-label">Songs by artist: </label>
                      <small class="text-muted ms-2">(Hold Ctrl/Cmd to select multiple)</small>
                      <select id="artistSongs" class="form-select" formControlName="artistSongs" multiple>
                        <option value="">Select songs</option>
                        @for (song of artistSongsDropdown; track song._id) {
                            <option [value]="song._id">{{ song.songTitle }}</option>
                        }
                      </select>

                      <a routerLink="/add-song" class="btn btn-link btn-sm ps-0">+ Add new song</a>
                    </div>

                    <div class="mb-3">
                      <label for="artistAlbums" class="form-label">Albums by artist: </label>
                      <small class="text-muted ms-2">(Hold Ctrl/Cmd to select multiple)</small>
                      <select id="artistAlbums" class="form-select" formControlName="artistAlbums" multiple>
                      <option value="">Select an album</option>
                      @for (album of artistAlbumsDropdown; track album._id) {
                          <option [value]="album._id">{{ album.albumName }}</option>
                      }
                      </select>

                      <a routerLink="/add-album" class="btn btn-link btn-sm ps-0">+ Add new album</a>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a routerLink="/view-all-artists" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                  </form>
</div>
            </div>
        </div>
    </div>
</div>
