<form [formGroup]="addAlbumForm" (ngSubmit)="onSubmit()">

  <label for="albumName">Album name: </label>
  <input id="albumName" type="text" formControlName="albumName" />
  @if(addAlbumForm?.get('albumName')?.invalid && addAlbumForm?.get('albumName')?.touched) {
    <div class="text-danger">Please enter an Album name</div>
  }

  <label for="albumArtist">Artist: </label>
  <select formControlName="albumArtist">
    <option value="">Select artist</option>
    @for (artist of albumArtistDropdown; track artist._id) {
        <option [value]="artist._id">{{ artist.artistName }}</option>
    }

    @if(addAlbumForm?.get('albumArtist')?.invalid && addAlbumForm?.get('albumArtist')?.touched) {
        <div class="text-danger">Please select or add the album artist</div>
    }
    </select>

    <a routerLink="/add-artist">Add new artist</a>

  <label for="albumReleaseDate">Release date: </label>
  <input type="date" id="albumReleaseDate" formControlName="albumReleaseDate" />

  <label for="albumGenre">Genre: </label>
  <input id="albumGenre" type="email" formControlName="albumGenre" />

  <label for="albumSongs">Songs: </label>
  <select formControlName="albumSongs" multiple>
    <option value="">Select songs</option>
    @for (song of albumSongsDropdown; track song._id) {
        <option [value]="song._id">{{ song.songTitle }}</option>
    }

    @if(addAlbumForm?.get('albumSongs')?.invalid && addAlbumForm?.get('albumSongs')?.touched) {
        <div class="text-danger">Please select or add songs</div>
    }
    </select>

    <a routerLink="/add-song">Add new song</a>

  <button type="submit">Submit</button>
  </form>

  @if (notificationService.message) {
    <div [class]="'notification ' + notificationService.messageType">
        {{ notificationService.message }}
    </div>
  }
