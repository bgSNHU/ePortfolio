<form [formGroup]="addUserForm" (ngSubmit)="onSubmit()">

  <label for="userName">Username: </label>
  <input id="userName" type="text" formControlName="userName" />

  <label for="userFirstName">First Name: </label>
  <input id="userFirstName" type="text" formControlName="userFirstName" />

  <label for="userLastName">Last Name: </label>
  <input id="userLastName" type="text" formControlName="userLastName" />

  <label for="userEmail">Email: </label>
  <input id="userEmail" type="text" formControlName="userEmail" />

  <label for="userRole">User role: </label>
  <select id="userRole" formControlName="userRole">
    <option value="">Select a role</option>
    <option value=""

  <label for="userPassword">Password: </label>
  <input id="userPassword" type="password" formControlName="userPassword" />

  <button type="submit">Submit</button>
</form>
