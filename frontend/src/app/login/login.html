<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Login</h1>
        <div>
            <a routerLink="/" class="btn btn-outline-secondary me-2">Home</a>
            <a routerLink="/add-user" class="btn btn-primary">+ Add New User</a>
        </div>
    </div>

<select [(ngModel)]="selectedUserId" select class="form-select" aria-label="Default select example">
    <option value="">Select your username</option>
    @for (user of usersDropdown; track user._id) {
        <option [value]="user._id">{{ user.userName }}</option>
    }
</select>

<button (click)="onLogin()" class="btn btn-primary mt-3">Login</button>
